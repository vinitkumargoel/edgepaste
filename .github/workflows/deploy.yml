# Auto-deploy edgepaste to Cloudflare Workers on every push to main.
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN   — token with Workers Scripts:Edit + D1:Edit
#                            (create from the "Edit Cloudflare Workers" template
#                             and add the D1 permission)
#   CLOUDFLARE_ACCOUNT_ID  — the account id (set already)
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply edgepaste --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build & deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
